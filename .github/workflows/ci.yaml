name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install dprint
        uses: taiki-e/install-action@v2
        with:
          tool: dprint

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.1.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: mkdir-action
          sparse-checkout: action.yml
          sparse-checkout-cone-mode: false

      - name: Directory should not exist
        shell: bash
        run: "! test -d dir"

      - name: Create directory
        uses: ./mkdir-action
        with:
          name: dir

      - name: Directory should exist
        shell: bash
        run: test -d dir
